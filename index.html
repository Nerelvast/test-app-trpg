<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteka TRPG</title>
<meta name="theme-color" content="#5e1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteka TRPG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/*
VOICE: spokojne narzędzie kolekcjonera, rzeczowe, z nutą fantasy
IDEA: grzbiety podręczników na półce — każdy wpis to grzbiet w kolorze swojego systemu
PICTURE: sama lista-półka; nagłówek bordowy jak oprawa
COLOUR and TYPE: bordo #5e1b2d, morski #0f7480, złamana biel; czcionki systemowe (offline)
LAYOUT: jedna kolumna na telefonie, pływający przycisk dodawania, arkusz edycji od dołu
*/
:root{color-scheme:light dark;
--bg:light-dark(#f6f4f2,#15121a);--card:light-dark(#fff,#211c27);--ink:light-dark(#1c1720,#efe9f2);
--mute:light-dark(#6b6370,#a79fae);--line:light-dark(#e3dde2,#352e3c);--wine:#5e1b2d;--wine2:#7d2740;
--sea:light-dark(#0f7480,#4fb7c3);--warn:#b3261e;--field:light-dark(#faf8f9,#1a161f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--wine);color:#fbeff2;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
.top{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}
h1{font:700 22px/1.1 Georgia,"Times New Roman",serif;margin:0;flex:1;letter-spacing:.2px}
h1 small{display:block;font:13px/1.3 system-ui,sans-serif;opacity:.8;margin-top:3px}
.icon{width:44px;height:44px;border:0;border-radius:12px;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px}
.search{max-width:900px;margin:12px auto 0;display:flex;gap:8px}
.search input{flex:1;height:44px;border-radius:12px;border:0;padding:0 14px;background:#fff;color:#1c1720;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:900px;margin:10px auto 0;scrollbar-width:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #ffffff40;background:transparent;color:#fbeff2;cursor:pointer}
.tabs button.on{background:#fbeff2;color:var(--wine);border-color:#fbeff2;font-weight:600}
main{max-width:900px;margin:auto;padding:12px max(12px,env(safe-area-inset-left))}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.filters select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:14px}
.sum{color:var(--mute);font-size:14px;margin:4px 2px 10px}
.group h2{font:600 15px/1.2 Georgia,serif;margin:18px 2px 8px;display:flex;justify-content:space-between;color:var(--ink)}
.group h2 span{color:var(--mute);font:13px system-ui,sans-serif}
.book{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;cursor:pointer;width:100%;text-align:left;padding:0}
.book:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.spine{width:10px;flex:none}
.cover{width:52px;flex:none;margin:10px 0;border-radius:4px;object-fit:cover;background:var(--line)}
.binfo{flex:1;padding:10px 12px 10px 0}
.bt{font-weight:650;line-height:1.25}
.bm{color:var(--mute);font-size:14px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.tag.want{border-color:var(--sea);color:var(--sea)}.tag.lent{border-color:#c77d14;color:#c77d14}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty svg{width:96px;height:96px;opacity:.7}
.empty b{display:block;color:var(--ink);font-size:18px;margin:10px 0 4px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));height:58px;padding:0 22px 0 18px;border-radius:29px;border:0;background:var(--sea);color:#fff;font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:6}
.fab svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:20px}}
.panel h3{font:700 20px/1.2 Georgia,serif;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border:0;background:transparent;font-size:26px;cursor:pointer;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.grid input,.grid select,.grid textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:8px 10px;font-size:16px}
textarea{min-height:80px!important;resize:vertical}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.btn.del{color:var(--warn);border-color:var(--warn);background:transparent}
.menu .btn{width:100%;margin-bottom:8px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px/1.1 Georgia,serif}
.stat span{font-size:12px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
#copybox{width:100%;height:140px;font:12px monospace;margin-top:8px;display:none}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.fab{bottom:calc(84px + env(safe-area-inset-bottom))}
#toast{bottom:calc(156px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.bnav button{flex:1;min-height:56px;border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}
.bnav button svg{width:24px;height:24px}
.bnav button.on{color:var(--wine2)}
:root:not([data-theme=light]) .bnav button.on{color:light-dark(var(--wine2),#f08aa4)}
.filters.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.month{font:600 15px/1.2 Georgia,serif;margin:18px 2px 8px;display:flex;justify-content:space-between}
.month span{color:var(--mute);font:13px system-ui,sans-serif}
.play{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left;padding:10px 12px 10px 0;cursor:pointer;overflow:hidden}
.pday{width:58px;flex:none;text-align:center;border-right:4px solid;padding:2px 0}
.pday b{display:block;font:700 24px/1 Georgia,serif}
.pday span{font-size:12px;color:var(--mute)}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:22px;cursor:pointer;color:var(--mute)}
.stars button.on{color:#d8a01a;border-color:#d8a01a}
.yearnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.yearnav b{font:700 28px/1 Georgia,serif}
.yearnav .btn{width:48px;font-size:24px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{margin:0 0 10px;font:600 16px/1.2 Georgia,serif}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 24px/1.1 Georgia,serif}
.kpi span{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.col i{display:block;width:100%;max-width:26px;background:var(--wine2);border-radius:5px 5px 2px 2px;min-height:2px}
.col.now i{background:var(--sea)}
.col em{font-style:normal;font-size:11px;color:var(--mute)}
.col small{font-size:11px;font-weight:700;min-height:14px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .bar{height:12px;background:var(--field);border-radius:6px;overflow:hidden}
.hrow .bar i{display:block;height:100%;border-radius:6px}
.hrow .v{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Biblioteka TRPG<small id="hdr">Twoja półka z podręcznikami</small></h1>
    <button class="icon" id="menuBtn" aria-label="Menu: kopia zapasowa, eksport, statystyki">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div id="shelfHdr">
  <div class="search"><input id="q" type="search" placeholder="Szukaj: tytuł, system, wydawca, ISBN…" autocomplete="off"></div>
  <div class="tabs" id="tabs">
    <button data-s="all" class="on">Wszystko</button>
    <button data-s="own">Mam</button>
    <button data-s="want">Chcę kupić</button>
    <button data-s="lent">Pożyczone</button>
  </div>
  </div>
</header>

<main>
 <section id="vShelf">
  <div class="filters">
    <select id="fSys" aria-label="System"></select>
    <select id="fType" aria-label="Typ"></select>
    <select id="fSort" aria-label="Sortowanie">
      <option value="sys">Wg systemu</option>
      <option value="title">Wg tytułu</option>
      <option value="new">Ostatnio dodane</option>
      <option value="year">Wg roku</option>
    </select>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
 </section>

 <section id="vPlays" hidden>
  <div class="filters two">
    <select id="pYear" aria-label="Rok"></select>
    <select id="pSys" aria-label="System"></select>
  </div>
  <div class="sum" id="pSum"></div>
  <div id="pList"></div>
 </section>

 <section id="vStats" hidden>
  <div class="yearnav">
    <button class="btn" id="yPrev" aria-label="Poprzedni rok">‹</button>
    <b id="yLabel"></b>
    <button class="btn" id="yNext" aria-label="Następny rok">›</button>
  </div>
  <div id="statsBody"></div>
 </section>
</main>

<button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addLbl">Dodaj</span></button>

<nav class="bnav" id="bnav">
  <button data-v="shelf" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z"/></svg>Półka</button>
  <button data-v="plays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2 7 14h10zM7 14l5 8 5-8"/></svg>Sesje</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Statystyki</button>
</nav>

<div class="sheet" id="playSheet" role="dialog" aria-modal="true" aria-labelledby="plTitle">
  <form class="panel" id="pform" autocomplete="off">
    <h3><span id="plTitle">Nowa sesja</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="grid">
      <div><label for="p_date">Data *</label><input id="p_date" type="date" required></div>
      <div><label for="p_hours">Czas gry (godz.)</label><input id="p_hours" inputmode="decimal" placeholder="np. 4 lub 3,5"></div>
      <div class="full"><label for="p_system">System *</label><input id="p_system" list="sysList" required placeholder="np. Warhammer FRP"></div>
      <div class="full"><label for="p_campaign">Kampania / przygoda</label><input id="p_campaign" list="campList" placeholder="np. Wewnętrzny Wróg, Curse of Strahd"></div>
      <div><label for="p_role">Moja rola</label><select id="p_role"><option value="gm">Mistrz Gry</option><option value="player">Gracz</option></select></div>
      <div><label for="p_mode">Gdzie</label><select id="p_mode"><option>Przy stole</option><option>Online</option><option>Konwent</option></select></div>
      <div class="full"><label for="p_players">Kto grał</label><input id="p_players" placeholder="np. Ania, Bartek, Kuba"></div>
      <div class="full"><label>Ocena sesji</label><div class="stars" id="p_stars"></div></div>
      <div class="full"><label for="p_notes">Notatki</label><textarea id="p_notes" placeholder="Co się wydarzyło, co przygotować na następny raz…"></textarea></div>
    </div>
    <div class="btns">
      <button type="button" class="btn del" id="pDel" hidden>Usuń</button>
      <button type="submit" class="btn pri">Zapisz sesję</button>
    </div>
  </form>
</div>
<datalist id="campList"></datalist>

<div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <form class="panel" id="form" autocomplete="off">
    <h3><span id="edTitle">Nowy podręcznik</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="grid">
      <div class="full"><label for="title">Tytuł *</label><input id="title" required></div>
      <div><label for="system">System *</label><input id="system" list="sysList" required placeholder="np. D&D, Warhammer"></div>
      <div><label for="edition">Edycja</label><input id="edition" list="edList" placeholder="np. 5e, 4. ed."></div>
      <div><label for="type">Typ</label><select id="type"></select></div>
      <div><label for="publisher">Wydawca</label><input id="publisher" list="pubList"></div>
      <div><label for="format">Format</label><select id="format"><option>Papier</option><option>PDF</option><option>Papier + PDF</option></select></div>
      <div><label for="lang">Język</label><select id="lang"><option>polski</option><option>angielski</option><option>niemiecki</option><option>inny</option></select></div>
      <div><label for="status">Status</label><select id="status"><option value="own">Mam</option><option value="want">Chcę kupić</option><option value="lent">Pożyczony komuś</option></select></div>
      <div id="lentWrap"><label for="lentTo">Komu pożyczony</label><input id="lentTo"></div>
      <div><label for="cond">Stan</label><select id="cond"><option value="">—</option><option>Nowy / folia</option><option>Bardzo dobry</option><option>Dobry</option><option>Używany</option><option>Zniszczony</option></select></div>
      <div><label for="year">Rok wydania</label><input id="year" inputmode="numeric" maxlength="4"></div>
      <div><label for="isbn">ISBN</label><input id="isbn" inputmode="numeric"></div>
      <div><label for="price">Cena (zł)</label><input id="price" inputmode="decimal"></div>
      <div class="full"><label for="loc">Gdzie stoi</label><input id="loc" list="locList" placeholder="np. regał 2, półka górna"></div>
      <div class="full"><label for="notes">Notatki</label><textarea id="notes" placeholder="Autografy, errata, braki, mapy w środku…"></textarea></div>
      <div class="full"><label>Okładka</label>
        <div class="photo"><img id="prev" alt=""><div>
          <input type="file" id="file" accept="image/*" capture="environment" hidden>
          <button type="button" class="btn" id="photoBtn">Zrób / wybierz zdjęcie</button>
          <button type="button" class="btn" id="photoDel" hidden>Usuń</button>
        </div></div>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="btn del" id="delBtn" hidden>Usuń</button>
      <button type="submit" class="btn pri">Zapisz</button>
    </div>
  </form>
</div>

<div class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="panel menu">
    <h3><span id="mTitle">Kolekcja</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="stats" id="stats"></div>
    <button class="btn" id="expJson">Zapisz kopię zapasową (.json)</button>
    <button class="btn" id="impJson">Wczytaj kopię zapasową</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn" id="expCsv">Eksportuj podręczniki do Excela (.csv)</button>
    <button class="btn" id="expPlaysCsv">Eksportuj sesje do Excela (.csv)</button>
    <textarea id="copybox" readonly></textarea>
    <p class="note">Wszystko jest zapisane tylko na tym telefonie. Rób kopię zapasową co jakiś czas i trzymaj ją np. na Dysku Google albo w iCloud.</p>
  </div>
</div>

<div class="sheet" id="confirmSheet" role="alertdialog" aria-modal="true">
  <div class="panel">
    <h3 id="cfText">Na pewno?</h3>
    <div class="btns"><button class="btn" data-close>Anuluj</button><button class="btn pri" id="cfOk">Tak</button></div>
  </div>
</div>

<div id="toast" role="status"></div>

<datalist id="sysList"></datalist><datalist id="edList"></datalist><datalist id="pubList"></datalist><datalist id="locList"></datalist>

<script>
{
const TYPES=['Podręcznik główny','Podręcznik gracza','Podręcznik MG','Bestiariusz','Setting / świat','Dodatek','Przygoda / kampania','Zestaw startowy','Ekran MG','Karty / akcesoria','Inne'];
const STATUS={own:'Mam',want:'Chcę kupić',lent:'Pożyczony'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let books=[],state={s:'all',q:'',sys:'',type:'',sort:'sys'},editId=null,photo='';

/* ---------- zapis: IndexedDB, awaryjnie localStorage, awaryjnie pamięć ---------- */
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('trpg-lib',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  async get(){if(this.db)return new Promise(r=>{try{const t=this.db.transaction('kv').objectStore('kv').get('books');t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
    try{return JSON.parse(localStorage.getItem('trpg-books'))}catch(e){return null}},
  async set(v){if(this.db){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,'books');return}catch(e){}}
    try{localStorage.setItem('trpg-books',JSON.stringify(v))}catch(e){toast('Nie udało się zapisać — zrób kopię zapasową!')}}
};

DB.getK=function(k){if(this.db)return new Promise(r=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
  try{return JSON.parse(localStorage.getItem('trpg-'+k))}catch(e){return null}};
DB.setK=function(k,v){if(this.db){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);return}catch(e){}}
  try{localStorage.setItem('trpg-'+k,JSON.stringify(v))}catch(e){toast('Nie udało się zapisać — zrób kopię zapasową!')}};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
function hue(s){let h=0;for(const c of String(s).toLowerCase())h=(h*31+c.charCodeAt(0))%360;return h}

function opts(sel,arr,all){const cur=sel.value;sel.innerHTML=`<option value="">${all}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join('');sel.value=arr.includes(cur)?cur:''}
const uniq=k=>[...new Set(books.map(b=>(b[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
function fillLists(){
  opts($('#fSys'),uniq('system'),'Każdy system');opts($('#fType'),TYPES.filter(t=>books.some(b=>b.type===t)),'Każdy typ');
  [['#edList','edition'],['#pubList','publisher'],['#locList','loc']].forEach(([id,k])=>$(id).innerHTML=uniq(k).map(v=>`<option value="${esc(v)}">`).join(''));
  const sys=[...new Set([...books.map(b=>b.system),...plays.map(p=>p.system)].map(s=>(s||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#sysList').innerHTML=sys.map(v=>`<option value="${esc(v)}">`).join('');
  const camp=[...new Set([...plays.map(p=>p.campaign),...books.filter(b=>/Przygoda/.test(b.type)).map(b=>b.title)].map(s=>(s||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#campList').innerHTML=camp.map(v=>`<option value="${esc(v)}">`).join('');
}
function filtered(){
  const q=state.q.toLowerCase().trim();
  let r=books.filter(b=>(state.s==='all'||b.status===state.s)&&(!state.sys||b.system===state.sys)&&(!state.type||b.type===state.type)&&
    (!q||[b.title,b.system,b.edition,b.publisher,b.isbn,b.notes,b.loc,b.lentTo].join(' ').toLowerCase().includes(q)));
  const t=(a,b)=>a.title.localeCompare(b.title,'pl');
  if(state.sort==='title')r.sort(t);
  else if(state.sort==='new')r.sort((a,b)=>b.added-a.added);
  else if(state.sort==='year')r.sort((a,b)=>(+b.year||0)-(+a.year||0)||t(a,b));
  else r.sort((a,b)=>a.system.localeCompare(b.system,'pl')||(a.edition||'').localeCompare(b.edition||'','pl')||TYPES.indexOf(a.type)-TYPES.indexOf(b.type)||t(a,b));
  return r;
}
function card(b){
  const meta=[b.edition,b.type,b.publisher,b.year].filter(Boolean).map(esc).join(' · ');
  const tags=[b.format,b.lang!=='polski'?b.lang:'',b.cond,b.loc?'📍 '+b.loc:''].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+
    (b.status!=='own'?`<span class="tag ${b.status}">${esc(STATUS[b.status])}${b.status==='lent'&&b.lentTo?': '+esc(b.lentTo):''}</span>`:'');
  return `<button class="book" data-id="${esc(b.id)}"><span class="spine" style="background:hsl(${hue(b.system)} 55% 38%)"></span>${b.photo?`<img class="cover" src="${esc(b.photo)}" alt="">`:''}
  <span class="binfo"><span class="bt">${esc(b.title)}</span><span class="bm" style="display:block">${state.sort==='sys'?'':esc(b.system)+(meta?' · ':'')}${meta}</span><span class="tags">${tags}</span></span></button>`;
}
function render(){
  const r=filtered(),L=$('#list');
  $('#hdr').textContent=books.length?`${books.filter(b=>b.status!=='want').length} na półce · ${books.filter(b=>b.status==='want').length} na liście życzeń`:'Twoja półka z podręcznikami';
  $('#sum').textContent=books.length?`Pokazano ${r.length} z ${books.length}`:'';
  if(!books.length){L.innerHTML=`<div class="empty"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M50 8 88 30v40L50 92 12 70V30z"/><path d="M50 8 30 58h40zM12 30l18 28M88 30 70 58M30 58 50 92l20-34M12 70l18-12M88 70 70 58"/></svg><b>Półka jest pusta</b>Dodaj pierwszy podręcznik przyciskiem „Dodaj”.</div>`;return}
  if(!r.length){L.innerHTML=`<div class="empty"><b>Nic nie pasuje</b>Zmień wyszukiwanie lub filtry.</div>`;return}
  if(state.sort!=='sys'){L.innerHTML=r.map(card).join('');return}
  const g={};r.forEach(b=>(g[b.system]=g[b.system]||[]).push(b));
  L.innerHTML=Object.entries(g).map(([s,a])=>`<section class="group"><h2>${esc(s)}<span>${a.length}</span></h2>${a.map(card).join('')}</section>`).join('');
}

/* ---------- statystyki ---------- */
let sYear=new Date().getFullYear(),sMetric='n';
function hbars(rows,unit){const mx=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([n,v,c])=>`<div class="hrow"><span class="nm">${esc(n)}</span><span class="bar"><i style="width:${Math.max(2,v/mx*100)}%;background:${c||'var(--sea)'}"></i></span><span class="v">${unit(v)}</span></div>`).join('')}
function renderStats(){
  $('#yLabel').textContent=sYear;
  const B=$('#statsBody'),Y=plays.filter(p=>p.date.startsWith(String(sYear)));
  if(!plays.length){B.innerHTML=`<div class="empty"><b>Brak danych</b>Statystyki pojawią się po zapisaniu pierwszych sesji.</div>`;return}
  const H=Y.reduce((s,p)=>s+hrs(p),0),gm=Y.filter(p=>p.role==='gm').length;
  const m=Array.from({length:12},(_,i)=>{const a=Y.filter(p=>+p.date.slice(5,7)===i+1);return{n:a.length,h:a.reduce((s,p)=>s+hrs(p),0)}});
  const val=x=>sMetric==='n'?x.n:x.h,mx=Math.max(1,...m.map(val));
  const now=new Date(),curM=now.getFullYear()===sYear?now.getMonth():-1;
  const bySys={};Y.forEach(p=>{const o=bySys[p.system]=bySys[p.system]||{n:0,h:0};o.n++;o.h+=hrs(p)});
  const sysRows=Object.entries(bySys).sort((a,b)=>val(b[1])-val(a[1])||b[1].n-a[1].n).slice(0,8).map(([s,o])=>[s,val(o),`hsl(${hue(s)} 55% 38%)`]);
  const byCamp={};Y.filter(p=>p.campaign).forEach(p=>{const k=p.campaign;byCamp[k]=(byCamp[k]||0)+1});
  const campRows=Object.entries(byCamp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,n])=>[c,n]);
  const ppl={};Y.forEach(p=>(p.players||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>ppl[n]=(ppl[n]||0)+1));
  const pplRows=Object.entries(ppl).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,n])=>[c,n,'var(--wine2)']);
  const best=m.reduce((bi,x,i)=>val(x)>val(m[bi])?i:bi,0);
  const unitF=v=>sMetric==='n'?String(v):fmtH(v)+' h';
  const cm=curM>=0?m[curM]:null;
  const all=plays.length,allH=plays.reduce((s,p)=>s+hrs(p),0);
  B.innerHTML=`
  <div class="kpis">
    <div class="kpi"><b>${Y.length}</b><span>${sesje(Y.length)} w ${sYear}</span></div>
    <div class="kpi"><b>${fmtH(H)}</b><span>godzin gry</span></div>
    <div class="kpi"><b>${Object.keys(bySys).length}</b><span>systemów</span></div>
    <div class="kpi"><b>${Y.length?Math.round(gm/Y.length*100):0}%</b><span>jako MG</span></div>
  </div>
  ${cm?`<div class="card"><h4>${MONF[curM]} ${sYear}</h4><div class="bm">${cm.n} ${sesje(cm.n)} · ${fmtH(cm.h)} godz.${curM>0?` · w ${MONL[curM-1]}: ${m[curM-1].n}`:''}</div></div>`:''}
  <div class="card"><h4>Miesiąc po miesiącu</h4>
    <div class="seg"><button data-m="n" class="${sMetric==='n'?'on':''}">Sesje</button><button data-m="h" class="${sMetric==='h'?'on':''}">Godziny</button></div>
    <div class="cols">${m.map((x,i)=>`<div class="col ${i===curM?'now':''}"><small>${val(x)?unitF(val(x)).replace(' h',''):''}</small><i style="height:${val(x)/mx*100}%"></i><em>${MON[i].slice(0,3)}</em></div>`).join('')}</div>
    ${Y.length?`<p class="note">Najaktywniejszy miesiąc: ${MONF[best].toLowerCase()} (${unitF(val(m[best]))}). Średnio ${fmtH(Y.length/Math.max(1,(curM>=0?curM+1:12)-m.findIndex(x=>x.n>0)))} sesji miesięcznie (licząc od pierwszej sesji w roku).</p>`:`<p class="note">Brak sesji w tym roku.</p>`}
  </div>
  ${sysRows.length?`<div class="card"><h4>Systemy</h4>${hbars(sysRows,unitF)}</div>`:''}
  ${campRows.length?`<div class="card"><h4>Kampanie i przygody</h4>${hbars(campRows,v=>v+' '+sesje(v))}</div>`:''}
  ${pplRows.length?`<div class="card"><h4>Najczęściej przy stole</h4>${hbars(pplRows,v=>v+'×')}</div>`:''}
  <div class="card"><h4>Od początku</h4><div class="bm">${all} ${sesje(all)} · ${fmtH(allH)} godz. · ${new Set(plays.map(p=>p.system)).size} systemów · pierwsza sesja ${esc([...plays].sort((a,b)=>a.date.localeCompare(b.date))[0].date.split('-').reverse().join('.'))}</div></div>`;
}

async function deliver(name,text,mime){
  const blob=new Blob([text],{type:mime}),file=new File([blob],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Zapisano plik '+name)}catch(e){}
  const box=$('#copybox');box.value=text;box.style.display='block';
}
const stamp=()=>new Date().toISOString().slice(0,10);
$('#expJson').onclick=()=>deliver(`biblioteka-trpg-${stamp()}.json`,JSON.stringify({app:'biblioteka-trpg',v:2,books,plays},null,1),'application/json');
$('#expCsv').onclick=()=>{
  const H=['Tytuł','System','Edycja','Typ','Wydawca','Format','Język','Status','Komu pożyczony','Stan','Rok','ISBN','Cena','Gdzie stoi','Notatki'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=books.map(b=>F.map(k=>q(k==='status'?STATUS[b[k]]:b[k])).join(';'));
  deliver(`biblioteka-trpg-${stamp()}.csv`,'﻿'+[H.map(q).join(';'),...rows].join('\r\n'),'text/csv');
};
$('#expPlaysCsv').onclick=()=>{
  const H=['Data','System','Kampania / przygoda','Rola','Gdzie','Godziny','Kto grał','Ocena','Notatki'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[...plays].sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[p.date,p.system,p.campaign,p.role==='gm'?'MG':'Gracz',p.mode,String(p.hours||'').replace('.',','),p.players,p.rating||'',p.notes].map(q).join(';'));
  deliver(`sesje-trpg-${stamp()}.csv`,'﻿'+[H.map(q).join(';'),...rows].join('\r\n'),'text/csv');
};
$('#impJson').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result),arr=Array.isArray(d)?d:d.books;if(!Array.isArray(arr))throw 0;
    const clean=arr.filter(b=>b&&b.title&&b.system).map(b=>{const o={id:String(b.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),added:+b.added||Date.now(),photo:typeof b.photo==='string'&&b.photo.startsWith('data:image/')?b.photo:''};F.forEach(k=>o[k]=String(b[k]??''));if(!STATUS[o.status])o.status='own';return o});
    const PK=['date','hours','system','campaign','role','mode','players','notes'];
    const cleanP=Array.isArray(d.plays)?d.plays.filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&p.system).map(p=>{const o={id:String(p.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),added:+p.added||Date.now(),rating:Math.min(5,Math.max(0,+p.rating||0))};PK.forEach(k=>o[k]=String(p[k]??''));if(o.role!=='player')o.role='gm';return o}):null;
    confirmBox(`Wczytać ${clean.length} podręczników${cleanP?` i ${cleanP.length} sesji`:''}? Obecne dane zostaną zastąpione.`,()=>{books=clean;save();if(cleanP){plays=cleanP;savePlays()}close($('#menuSheet'));refresh();toast('Wczytano kopię')})}
    catch(x){toast('To nie jest poprawny plik kopii')}};r.readAsText(f)};

/* ---------- start ---------- */
(async()=>{await DB.open();books=(await DB.get())||[];plays=(await DB.getK('plays'))||[];refresh();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
}
</script>
