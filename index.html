<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteka TRPG</title>
<meta name="theme-color" content="#5e1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteka TRPG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/*
VOICE: spokojne narzędzie kolekcjonera, rzeczowe, z nutą fantasy
IDEA: grzbiety podręczników na półce — każdy wpis to grzbiet w kolorze swojego systemu
PICTURE: sama lista-półka; nagłówek bordowy jak oprawa
COLOUR and TYPE: bordo #5e1b2d, morski #0f7480, złamana biel; czcionki systemowe (offline)
LAYOUT: jedna kolumna na telefonie, pływający przycisk dodawania, arkusz edycji od dołu
*/
:root{color-scheme:light dark;
--bg:light-dark(#f6f4f2,#15121a);--card:light-dark(#fff,#211c27);--ink:light-dark(#1c1720,#efe9f2);
--mute:light-dark(#6b6370,#a79fae);--line:light-dark(#e3dde2,#352e3c);--wine:#5e1b2d;--wine2:#7d2740;
--sea:light-dark(#0f7480,#4fb7c3);--warn:#b3261e;--field:light-dark(#faf8f9,#1a161f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--wine);color:#fbeff2;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
.top{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}
h1{font:700 22px/1.1 Georgia,"Times New Roman",serif;margin:0;flex:1;letter-spacing:.2px}
h1 small{display:block;font:13px/1.3 system-ui,sans-serif;opacity:.8;margin-top:3px}
.icon{width:44px;height:44px;border:0;border-radius:12px;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px}
.search{max-width:900px;margin:12px auto 0;display:flex;gap:8px}
.search input{flex:1;height:44px;border-radius:12px;border:0;padding:0 14px;background:#fff;color:#1c1720;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:900px;margin:10px auto 0;scrollbar-width:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #ffffff40;background:transparent;color:#fbeff2;cursor:pointer}
.tabs button.on{background:#fbeff2;color:var(--wine);border-color:#fbeff2;font-weight:600}
main{max-width:900px;margin:auto;padding:12px max(12px,env(safe-area-inset-left))}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.filters select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:14px}
.sum{color:var(--mute);font-size:14px;margin:4px 2px 10px}
.group h2{font:600 15px/1.2 Georgia,serif;margin:18px 2px 8px;display:flex;justify-content:space-between;color:var(--ink)}
.group h2 span{color:var(--mute);font:13px system-ui,sans-serif}
.book{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;cursor:pointer;width:100%;text-align:left;padding:0}
.book:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.spine{width:10px;flex:none}
.cover{width:52px;flex:none;margin:10px 0;border-radius:4px;object-fit:cover;background:var(--line)}
.binfo{flex:1;padding:10px 12px 10px 0}
.bt{font-weight:650;line-height:1.25}
.bm{color:var(--mute);font-size:14px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.tag.want{border-color:var(--sea);color:var(--sea)}.tag.lent{border-color:#c77d14;color:#c77d14}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty svg{width:96px;height:96px;opacity:.7}
.empty b{display:block;color:var(--ink);font-size:18px;margin:10px 0 4px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));height:58px;padding:0 22px 0 18px;border-radius:29px;border:0;background:var(--sea);color:#fff;font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:6}
.fab svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:20px}}
.panel h3{font:700 20px/1.2 Georgia,serif;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border:0;background:transparent;font-size:26px;cursor:pointer;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.grid input,.grid select,.grid textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:8px 10px;font-size:16px}
textarea{min-height:80px!important;resize:vertical}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.btn.del{color:var(--warn);border-color:var(--warn);background:transparent}
.menu .btn{width:100%;margin-bottom:8px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px/1.1 Georgia,serif}
.stat span{font-size:12px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
#copybox{width:100%;height:140px;font:12px monospace;margin-top:8px;display:none}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.fab{bottom:calc(84px + env(safe-area-inset-bottom))}
#toast{bottom:calc(156px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.bnav button{flex:1;min-height:56px;border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}
.bnav button svg{width:24px;height:24px}
.bnav button.on{color:var(--wine2)}
:root:not([data-theme=light]) .bnav button.on{color:light-dark(var(--wine2),#f08aa4)}
.filters.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.month{font:600 15px/1.2 Georgia,serif;margin:18px 2px 8px;display:flex;justify-content:space-between}
.month span{color:var(--mute);font:13px system-ui,sans-serif}
.play{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left;padding:10px 12px 10px 0;cursor:pointer;overflow:hidden}
.pday{width:58px;flex:none;text-align:center;border-right:4px solid;padding:2px 0}
.pday b{display:block;font:700 24px/1 Georgia,serif}
.pday span{font-size:12px;color:var(--mute)}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:22px;cursor:pointer;color:var(--mute)}
.stars button.on{color:#d8a01a;border-color:#d8a01a}
.yearnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.yearnav b{font:700 28px/1 Georgia,serif}
.yearnav .btn{width:48px;font-size:24px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{margin:0 0 10px;font:600 16px/1.2 Georgia,serif}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 24px/1.1 Georgia,serif}
.kpi span{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.col i{display:block;width:100%;max-width:26px;background:var(--wine2);border-radius:5px 5px 2px 2px;min-height:2px}
.col.now i{background:var(--sea)}
.col em{font-style:normal;font-size:11px;color:var(--mute)}
.col small{font-size:11px;font-weight:700;min-height:14px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .bar{height:12px;background:var(--field);border-radius:6px;overflow:hidden}
.hrow .bar i{display:block;height:100%;border-radius:6px}
.hrow .v{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.top .icon+.icon{margin-left:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips:empty{display:none}
.chips button{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:15px}
.chips button.on{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:600}
.person{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left;padding:10px 12px;cursor:pointer}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 17px/1 Georgia,serif}
.pstat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.pstat h5{margin:10px 0 4px;font-size:13px;color:var(--mute);font-weight:600}
.pstat h5:first-child{margin-top:0}
.pstat ul{margin:0;padding-left:18px}
.isbnrow{display:flex;flex-wrap:wrap;gap:6px}
.isbnrow input{flex:1 1 100%}
.isbnrow .btn{flex:1;padding:0 12px}
#isbnMsg:empty{display:none}
.sheet.scan{background:#000;align-items:stretch;z-index:15}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax #0009;overflow:hidden}
.scan .frame i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff5a5a;box-shadow:0 0 8px #ff5a5a;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:15%}to{top:85%}}
@media(prefers-reduced-motion:reduce){.scan .frame i{animation:none}}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.scanbar p{margin:0 0 4px;font-size:16px;text-shadow:0 1px 3px #000}
.scanbar .btns{justify-content:center}
.scanbar .btn{background:#ffffffe6;color:#1c1720;border:0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Biblioteka TRPG<small id="hdr">Twoja półka z podręcznikami</small></h1>
    <button class="icon" id="scanTop" aria-label="Skanuj kod kreskowy książki">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
    </button>
    <button class="icon" id="menuBtn" aria-label="Menu: kopia zapasowa, eksport, statystyki">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div id="shelfHdr">
  <div class="search"><input id="q" type="search" placeholder="Szukaj: tytuł, system, wydawca, ISBN…" autocomplete="off"></div>
  <div class="tabs" id="tabs">
    <button data-s="all" class="on">Wszystko</button>
    <button data-s="own">Mam</button>
    <button data-s="want">Chcę kupić</button>
    <button data-s="lent">Pożyczone</button>
  </div>
  </div>
</header>

<main>
 <section id="vShelf">
  <div class="filters">
    <select id="fSys" aria-label="System"></select>
    <select id="fType" aria-label="Typ"></select>
    <select id="fSort" aria-label="Sortowanie">
      <option value="sys">Wg systemu</option>
      <option value="title">Wg tytułu</option>
      <option value="new">Ostatnio dodane</option>
      <option value="year">Wg roku</option>
    </select>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
 </section>

 <section id="vPlays" hidden>
  <div class="filters two">
    <select id="pYear" aria-label="Rok"></select>
    <select id="pSys" aria-label="System"></select>
  </div>
  <div class="sum" id="pSum"></div>
  <div id="pList"></div>
 </section>

 <section id="vPeople" hidden>
  <div class="sum" id="plSum"></div>
  <div id="plList"></div>
 </section>

 <section id="vStats" hidden>
  <div class="yearnav">
    <button class="btn" id="yPrev" aria-label="Poprzedni rok">‹</button>
    <b id="yLabel"></b>
    <button class="btn" id="yNext" aria-label="Następny rok">›</button>
  </div>
  <div id="statsBody"></div>
 </section>
</main>

<button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addLbl">Dodaj</span></button>

<nav class="bnav" id="bnav">
  <button data-v="shelf" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z"/></svg>Półka</button>
  <button data-v="plays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2 7 14h10zM7 14l5 8 5-8"/></svg>Sesje</button>
  <button data-v="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.2c2.4.2 4 1.8 4.6 4.8"/></svg>Gracze</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Statystyki</button>
</nav>

<div class="sheet" id="playSheet" role="dialog" aria-modal="true" aria-labelledby="plTitle">
  <form class="panel" id="pform" autocomplete="off">
    <h3><span id="plTitle">Nowa sesja</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="grid">
      <div><label for="p_date">Data *</label><input id="p_date" type="date" required></div>
      <div><label for="p_hours">Czas gry (godz.)</label><input id="p_hours" inputmode="decimal" placeholder="np. 4 lub 3,5"></div>
      <div class="full"><label for="p_book">Podręcznik lub przygoda z półki</label><select id="p_book"></select></div>
      <div class="full"><label for="p_system">System *</label><input id="p_system" list="sysList" required placeholder="np. Warhammer FRP"></div>
      <div class="full"><label for="p_campaign">Kampania / przygoda</label><input id="p_campaign" list="campList" placeholder="np. Wewnętrzny Wróg, Curse of Strahd"></div>
      <div><label for="p_role">Moja rola</label><select id="p_role"><option value="gm">Mistrz Gry</option><option value="player">Gracz</option></select></div>
      <div><label for="p_mode">Gdzie</label><select id="p_mode"><option>Przy stole</option><option>Online</option><option>Konwent</option></select></div>
      <div class="full"><label for="p_players">Kto grał</label><div class="chips" id="p_chips"></div><input id="p_players" placeholder="stuknij powyżej albo wpisz nowe imię, po przecinku"></div>
      <div class="full"><label>Ocena sesji</label><div class="stars" id="p_stars"></div></div>
      <div class="full"><label for="p_notes">Notatki</label><textarea id="p_notes" placeholder="Co się wydarzyło, co przygotować na następny raz…"></textarea></div>
    </div>
    <div class="btns">
      <button type="button" class="btn del" id="pDel" hidden>Usuń</button>
      <button type="submit" class="btn pri">Zapisz sesję</button>
    </div>
  </form>
</div>
<datalist id="campList"></datalist><datalist id="plList"></datalist>

<div class="sheet" id="personSheet" role="dialog" aria-modal="true" aria-labelledby="peTitle">
  <form class="panel" id="peform" autocomplete="off">
    <h3><span id="peTitle">Nowy gracz</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="grid">
      <div class="full"><label for="pe_name">Imię lub ksywka *</label><input id="pe_name" required></div>
      <div class="full"><label for="pe_note">Notatki</label><textarea id="pe_note" placeholder="Postacie, ulubione systemy, kontakt, czego unikać przy stole…"></textarea></div>
    </div>
    <div id="peStats"></div>
    <div class="btns">
      <button type="button" class="btn del" id="peDel" hidden>Usuń</button>
      <button type="submit" class="btn pri">Zapisz</button>
    </div>
  </form>
</div>

<div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <form class="panel" id="form" autocomplete="off">
    <h3><span id="edTitle">Nowy podręcznik</span><button type="button" class="x" data-close aria-label="Zamknij">×</button></h3>
    <div class="grid">
      <div class="full"><label for="title">Tytuł *</label><input id="title" required></div>
      <div><label for="system">System *</label><input id="system" list="sysList" required placeholder="np. D&D, Warhammer"></div>
      <div><label for="edition">Edycja</label><input id="edition" list="edList" placeholder="np. 5e, 4. ed."></div>
      <div><label for="type">Typ</label><select id="type"></select></div>
      <div><label for="publisher">Wydawca</label><input id="publisher" list="pubList"></div>
      <div><label for="format">Format</label><select id="format"><option>Papier</option><option>PDF</option><option>Papier + PDF</option></select></div>
      <div><label for="lang">Język</label><select id="lang"><option>polski</option><option>angielski</option><option>niemiecki</option><option>inny</option></select></div>
      <div><label for="status">Status</label><select id="status"><option value="own">Mam</option><option value="want">Chcę kupić</option><option value="lent">Pożyczony komuś</option></select></div>
      <div id="lentWrap"><label for="lentTo">Komu pożyczony</label><input id="lentTo" list="plList"></div>
      <div><label for="cond">Stan</label><select id="cond"><option value="">—</option><option>Nowy / folia</option><option>Bardzo dobry</option><option>Dobry</option><option>Używany</option><option>Zniszczony</option></select></div>
      <div><label for="year">Rok wydania</label><input id="year" inputmode="numeric" maxlength="4"></div>

        <div class="isbnrow"><input id="isbn" inputmode="numeric" placeholder="zeskanuj lub wpisz">
          <button type="button" class="btn" id="isbnScan" aria-label="Skanuj kod">Skanuj</button>
          <button type="button" class="btn" id="isbnLook">Pobierz dane</button></div>

      <div class="full"><label for="notes">Notatki</label><textarea id="notes" placeholder="Autografy, errata, braki, mapy w środku…"></textarea></div>
      <div class="full"><label>Okładka</label>
        <div class="photo"><img id="prev" alt=""><div>
          <input type="file" id="file" accept="image/*" capture="environment" hidden>
          <button type="button" class="btn" id="photoBtn">Zrób / wybierz zdjęcie</button>
          <button type="button" class="btn" id="photoDel" hidden>Usuń</button>
        </div></div>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="btn del" id="delBtn" hidden>Usuń</button>
      <button type="submit" class="btn pri">Zapisz</button>
    </div>
  </form>
</div>

  <div class="panel menu">

    <div class="stats" id="stats"></div>
    <button class="btn" id="expJson">Zapisz kopię zapasową (.json)</button>

    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn" id="expCsv">Eksportuj podręczniki do Excela (.csv)</button>
    <button class="btn" id="expPlaysCsv">Eksportuj sesje do Excela (.csv)</button>

<div id="toast" role="status"></div>

<datalist id="sysList"></datalist><datalist id="edList"></datalist><datalist id="pubList"></datalist><datalist id="locList"></datalist>

<script>
{
const TYPES=['Podręcznik główny','Podręcznik gracza','Podręcznik MG','Bestiariusz','Setting / świat','Dodatek','Przygoda / kampania','Zestaw startowy','Ekran MG','Karty / akcesoria','Inne'];
const STATUS={own:'Mam',want:'Chcę kupić',lent:'Pożyczony'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let books=[],state={s:'all',q:'',sys:'',type:'',sort:'sys'},editId=null,photo='';

/* ---------- zapis: IndexedDB, awaryjnie localStorage, awaryjnie pamięć ---------- */
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('trpg-lib',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  async get(){if(this.db)return new Promise(r=>{try{const t=this.db.transaction('kv').objectStore('kv').get('books');t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
    try{return JSON.parse(localStorage.getItem('trpg-books'))}catch(e){return null}},
  async set(v){if(this.db){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,'books');return}catch(e){}}
    try{localStorage.setItem('trpg-books',JSON.stringify(v))}catch(e){toast('Nie udało się zapisać — zrób kopię zapasową!')}}
};
const save=()=>{DB.set(books);scheduleAutosave()};
/* sesje trzymane pod osobnym kluczem */
DB.getK=function(k){if(this.db)return new Promise(r=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
  try{return JSON.parse(localStorage.getItem('trpg-'+k))}catch(e){return null}};
DB.setK=function(k,v){if(this.db){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);return}catch(e){}}
  try{localStorage.setItem('trpg-'+k,JSON.stringify(v))}catch(e){toast('Nie udało się zapisać — zrób kopię zapasową!')}};
let plays=[];const savePlays=()=>{DB.setK('plays',plays);scheduleAutosave()};
let players=[];const savePlayers=()=>{DB.setK('players',players);scheduleAutosave()};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
function hue(s){let h=0;for(const c of String(s).toLowerCase())h=(h*31+c.charCodeAt(0))%360;return h}

/* ---------- lista ---------- */
function opts(sel,arr,all){const cur=sel.value;sel.innerHTML=`<option value="">${all}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join('');sel.value=arr.includes(cur)?cur:''}
const uniq=k=>[...new Set(books.map(b=>(b[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
function fillLists(){
  opts($('#fSys'),uniq('system'),'Każdy system');opts($('#fType'),TYPES.filter(t=>books.some(b=>b.type===t)),'Każdy typ');
  [['#edList','edition'],['#pubList','publisher'],['#locList','loc']].forEach(([id,k])=>$(id).innerHTML=uniq(k).map(v=>`<option value="${esc(v)}">`).join(''));
  const sys=[...new Set([...books.map(b=>b.system),...plays.map(p=>p.system)].map(s=>(s||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#sysList').innerHTML=sys.map(v=>`<option value="${esc(v)}">`).join('');
  const camp=[...new Set([...plays.map(p=>p.campaign),...books.filter(b=>/Przygoda/.test(b.type)).map(b=>b.title)].map(s=>(s||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#campList').innerHTML=camp.map(v=>`<option value="${esc(v)}">`).join('');
  $('#plList').innerHTML=players.map(p=>`<option value="${esc(p.name)}">`).join('');
}
function filtered(){
  const q=state.q.toLowerCase().trim();
  let r=books.filter(b=>(state.s==='all'||b.status===state.s)&&(!state.sys||b.system===state.sys)&&(!state.type||b.type===state.type)&&
    (!q||[b.title,b.system,b.edition,b.publisher,b.isbn,b.notes,b.loc,b.lentTo].join(' ').toLowerCase().includes(q)));
  const t=(a,b)=>a.title.localeCompare(b.title,'pl');
  if(state.sort==='title')r.sort(t);
  else if(state.sort==='new')r.sort((a,b)=>b.added-a.added);
  else if(state.sort==='year')r.sort((a,b)=>(+b.year||0)-(+a.year||0)||t(a,b));
  else r.sort((a,b)=>a.system.localeCompare(b.system,'pl')||(a.edition||'').localeCompare(b.edition||'','pl')||TYPES.indexOf(a.type)-TYPES.indexOf(b.type)||t(a,b));
  return r;
}
function card(b){
  const meta=[b.edition,b.type,b.publisher,b.year].filter(Boolean).map(esc).join(' · ');
  const tags=[b.format,b.lang!=='polski'?b.lang:'',b.cond,b.loc?'📍 '+b.loc:''].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+
    (b.status!=='own'?`<span class="tag ${b.status}">${esc(STATUS[b.status])}${b.status==='lent'&&b.lentTo?': '+esc(b.lentTo):''}</span>`:'');
  return `<button class="book" data-id="${esc(b.id)}"><span class="spine" style="background:hsl(${hue(b.system)} 55% 38%)"></span>${b.photo?`<img class="cover" src="${esc(b.photo)}" alt="">`:''}
  <span class="binfo"><span class="bt">${esc(b.title)}</span><span class="bm" style="display:block">${state.sort==='sys'?'':esc(b.system)+(meta?' · ':'')}${meta}</span><span class="tags">${tags}</span></span></button>`;
}
function render(){
  const r=filtered(),L=$('#list');
  $('#hdr').textContent=books.length?`${books.filter(b=>b.status!=='want').length} na półce · ${books.filter(b=>b.status==='want').length} na liście życzeń`:'Twoja półka z podręcznikami';
  $('#sum').textContent=books.length?`Pokazano ${r.length} z ${books.length}`:'';
  if(!books.length){L.innerHTML=`<div class="empty"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M50 8 88 30v40L50 92 12 70V30z"/><path d="M50 8 30 58h40zM12 30l18 28M88 30 70 58M30 58 50 92l20-34M12 70l18-12M88 70 70 58"/></svg><b>Półka jest pusta</b>Dodaj pierwszy podręcznik przyciskiem „Dodaj”.</div>`;return}
  if(!r.length){L.innerHTML=`<div class="empty"><b>Nic nie pasuje</b>Zmień wyszukiwanie lub filtry.</div>`;return}
  if(state.sort!=='sys'){L.innerHTML=r.map(card).join('');return}
  const g={};r.forEach(b=>(g[b.system]=g[b.system]||[]).push(b));
  L.innerHTML=Object.entries(g).map(([s,a])=>`<section class="group"><h2>${esc(s)}<span>${a.length}</span></h2>${a.map(card).join('')}</section>`).join('');
}
const refresh=()=>{fillLists();render();if(view==='plays')renderPlays();if(view==='stats')renderStats();if(view==='people')renderPeople()};

/* ---------- widoki ---------- */
let view='shelf';
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MONL=['styczniu','lutym','marcu','kwietniu','maju','czerwcu','lipcu','sierpniu','wrześniu','październiku','listopadzie','grudniu'];
const MONF=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const hrs=p=>parseFloat(String(p.hours||'').replace(',','.'))||0;
const fmtH=h=>(Math.round(h*10)/10).toString().replace('.',',');
const sesje=n=>n===1?'sesja':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'sesje':'sesji';
function setView(v){
  view=v;$('#vShelf').hidden=v!=='shelf';$('#vPlays').hidden=v!=='plays';$('#vStats').hidden=v!=='stats';$('#vPeople').hidden=v!=='people';$('#shelfHdr').hidden=v!=='shelf';
  $('#addBtn').hidden=v==='stats';$('#addLbl').textContent=v==='plays'?'Sesja':v==='people'?'Gracz':'Dodaj';
  document.querySelectorAll('#bnav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='plays')renderPlays();if(v==='stats')renderStats();if(v==='people')renderPeople();
  window.scrollTo(0,0);
}
$('#bnav').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};

/* ---------- sesje: lista ---------- */
let pst={year:'',sys:''};
function renderPlays(){
  const years=[...new Set(plays.map(p=>p.date.slice(0,4)))].sort().reverse();
  opts($('#pYear'),years,'Wszystkie lata');$('#pYear').value=years.includes(pst.year)?pst.year:'';
  opts($('#pSys'),[...new Set(plays.map(p=>p.system))].sort((a,b)=>a.localeCompare(b,'pl')),'Każdy system');$('#pSys').value=pst.sys&&plays.some(p=>p.system===pst.sys)?pst.sys:'';
  const r=plays.filter(p=>(!$('#pYear').value||p.date.startsWith($('#pYear').value))&&(!$('#pSys').value||p.system===$('#pSys').value)).sort((a,b)=>b.date.localeCompare(a.date)||b.added-a.added);
  const L=$('#pList');
  $('#pSum').textContent=plays.length?`${r.length} ${sesje(r.length)} · ${fmtH(r.reduce((s,p)=>s+hrs(p),0))} godz.`:'';
  if(!plays.length){L.innerHTML=`<div class="empty"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M50 8 88 30v40L50 92 12 70V30z"/><path d="M50 8 30 58h40zM30 58 50 92l20-34"/></svg><b>Brak zapisanych sesji</b>Stuknij „Sesja”, żeby zapisać pierwszą rozgrywkę.</div>`;return}
  if(!r.length){L.innerHTML=`<div class="empty"><b>Nic nie pasuje</b>Zmień filtry.</div>`;return}
  const g={};r.forEach(p=>(g[p.date.slice(0,7)]=g[p.date.slice(0,7)]||[]).push(p));
  L.innerHTML=Object.entries(g).map(([m,a])=>`<section><div class="month">${MONF[+m.slice(5)-1]} ${m.slice(0,4)}<span>${a.length} ${sesje(a.length)} · ${fmtH(a.reduce((s,p)=>s+hrs(p),0))} h</span></div>${a.map(p=>{
    const meta=[p.role==='gm'?'MG':'Gracz',hrs(p)?fmtH(hrs(p))+' h':'',p.mode!=='Przy stole'?p.mode:''].filter(Boolean).map(esc).join(' · ');
    return `<button class="play" data-id="${esc(p.id)}"><span class="pday" style="border-color:hsl(${hue(p.system)} 55% 38%)"><b>${+p.date.slice(8)}</b><span>${MON[+p.date.slice(5,7)-1]}</span></span><span class="binfo" style="padding:0"><span class="bt">${esc(p.system)}${p.campaign?' — '+esc(p.campaign):''}</span><span class="bm" style="display:block">${meta}${p.rating?' · '+'★'.repeat(+p.rating):''}</span>${p.players?`<span class="bm" style="display:block">👥 ${esc(p.players)}</span>`:''}</span></button>`}).join('')}</section>`).join('');
}
$('#pYear').onchange=e=>{pst.year=e.target.value;renderPlays()};
$('#pSys').onchange=e=>{pst.sys=e.target.value;renderPlays()};

/* ---------- sesje: formularz ---------- */
const PF=['date','hours','system','campaign','role','mode','players','notes'];
let pEdit=null,rating=0;
function drawStars(){$('#p_stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=rating?'on':''}" aria-label="${n} na 5">★</button>`).join('')}
$('#p_stars').onclick=e=>{const b=e.target.closest('button');if(!b)return;rating=+b.dataset.n===rating?0:+b.dataset.n;drawStars()};
function editPlay(p){
  pEdit=p?p.id:null;$('#plTitle').textContent=p?'Edytuj sesję':'Nowa sesja';$('#pDel').hidden=!p;
  const last=[...plays].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const d=p||{date:today(),role:last?last.role:'gm',mode:'Przy stole',system:pst.sys||(last?last.system:''),campaign:pst.sys&&last&&last.system!==pst.sys?'':(last?last.campaign:''),players:last&&(!pst.sys||last.system===pst.sys)?last.players:'',hours:''};
  PF.forEach(k=>$('#p_'+k).value=d[k]??'');rating=p?+p.rating||0:0;drawStars();
  fillBookPick(p&&p.bookId&&books.some(b=>b.id===p.bookId)?p.bookId:'');drawChips();open('#playSheet');
}
$('#pList').onclick=e=>{const c=e.target.closest('.play');if(c)editPlay(plays.find(p=>p.id===c.dataset.id))};
$('#pform').onsubmit=e=>{
  e.preventDefault();const d={};PF.forEach(k=>d[k]=$('#p_'+k).value.trim());d.rating=rating;d.bookId=$('#p_book').value;
  d.players=splitNames(d.players).join(', ');addPlayers(splitNames(d.players));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){toast('Podaj datę');return}
  if(pEdit){Object.assign(plays.find(p=>p.id===pEdit),d);toast('Zapisano zmiany')}
  else{plays.push({...d,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),added:Date.now()});toast('Sesja zapisana')}
  savePlays();close($('#playSheet'));refresh();
};
$('#pDel').onclick=()=>confirmBox('Usunąć tę sesję?',()=>{plays=plays.filter(p=>p.id!==pEdit);savePlays();close($('#playSheet'));refresh();toast('Usunięto')});

function fillBookPick(sel){
  const own=books.filter(b=>b.status!=='want'&&!isPending(b)),g={};
  own.forEach(b=>(g[b.system]=g[b.system]||[]).push(b));
  $('#p_book').innerHTML='<option value="">— wybierz, żeby ustawić system —</option>'+Object.keys(g).sort((a,b)=>a.localeCompare(b,'pl')).map(s=>
    `<optgroup label="${esc(s)}">${g[s].sort((a,b)=>(a.type.startsWith('Przygoda')?0:1)-(b.type.startsWith('Przygoda')?0:1)||a.title.localeCompare(b.title,'pl')).map(b=>`<option value="${esc(b.id)}">${esc(b.title)}${b.edition?' ('+esc(b.edition)+')':''}</option>`).join('')}</optgroup>`).join('');
  $('#p_book').value=sel||'';$('#p_book').disabled=!own.length;
}
$('#p_book').onchange=e=>{const b=books.find(x=>x.id===e.target.value);if(!b)return;
  $('#p_system').value=b.system;
  if(/Przygoda|Setting/.test(b.type))$('#p_campaign').value=b.title;
  toast('System: '+b.system)};

/* ---------- gracze ---------- */
const splitNames=v=>[...new Set(String(v||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean))];
const sameName=(a,b)=>a.toLocaleLowerCase('pl')===b.toLocaleLowerCase('pl');
const findPerson=n=>players.find(p=>sameName(p.name,n));
function addPlayers(names){let ch=false;names.forEach(n=>{if(n&&!findPerson(n)){players.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,note:'',added:Date.now()});ch=true}});if(ch)savePlayers()}
function drawChips(){
  const cur=splitNames($('#p_players').value);
  const order=players.map(p=>[p.name,plays.filter(x=>splitNames(x.players).some(n=>sameName(n,p.name))).length]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pl'));
  $('#p_chips').innerHTML=order.map(([n])=>`<button type="button" data-n="${esc(n)}" class="${cur.some(c=>sameName(c,n))?'on':''}">${esc(n)}</button>`).join('');
}
$('#p_chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.n;let cur=splitNames($('#p_players').value);
  cur=cur.some(c=>sameName(c,n))?cur.filter(c=>!sameName(c,n)):[...cur,n];$('#p_players').value=cur.join(', ');drawChips()};
$('#p_players').addEventListener('input',drawChips);
const initials=n=>n.split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
function personStats(name){
  const ps=plays.filter(x=>splitNames(x.players).some(n=>sameName(n,name))).sort((a,b)=>b.date.localeCompare(a.date));
  const sys={};ps.forEach(x=>sys[x.system]=(sys[x.system]||0)+1);
  return{ps,h:ps.reduce((s,x)=>s+hrs(x),0),sys:Object.entries(sys).sort((a,b)=>b[1]-a[1]),lent:books.filter(b=>b.status==='lent'&&b.lentTo&&sameName(b.lentTo,name))};
}
const dpl=d=>d.split('-').reverse().join('.');
function renderPeople(){
  const L=$('#plList');
  if(!players.length){$('#plSum').textContent='';L.innerHTML=`<div class="empty"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><circle cx="38" cy="36" r="14"/><path d="M12 84c3-16 13-24 26-24s23 8 26 24"/><circle cx="70" cy="40" r="10"/><path d="M70 62c10 1 16 8 18 20"/></svg><b>Brak graczy</b>Stuknij „Gracz”, albo po prostu wpisz imiona przy sesji — trafią tu same.</div>`;return}
  const rows=players.map(p=>({p,st:personStats(p.name)})).sort((a,b)=>b.st.ps.length-a.st.ps.length||a.p.name.localeCompare(b.p.name,'pl'));
  $('#plSum').textContent=`${players.length} ${players.length===1?'osoba':'osób'}`;
  L.innerHTML=rows.map(({p,st})=>`<button class="person" data-id="${esc(p.id)}"><span class="av" style="background:hsl(${hue(p.name)} 45% 40%)">${esc(initials(p.name))}</span>
    <span class="binfo" style="padding:0"><span class="bt">${esc(p.name)}</span><span class="bm" style="display:block">${st.ps.length?`${st.ps.length} ${sesje(st.ps.length)} · ostatnio ${dpl(st.ps[0].date)}`:'jeszcze bez sesji'}</span>

const DIR='Biblioteka TRPG';
const fsCall=(m,o)=>CAP.nativePromise('Filesystem',m,o);
let autoT=null,autoLast=0,autoErr=false,autoName='biblioteka-trpg.json';
function payload(){return JSON.stringify({app:'biblioteka-trpg',v:3,saved:new Date().toISOString(),books,plays,players})}
function writeDoc(path,data){return fsCall('writeFile',{path:DIR+'/'+path,data,directory:'DOCUMENTS',encoding:'utf8',recursive:true})}
async function installId(){let id=await DB.getK('iid');if(!id){id=Math.random().toString(36).slice(2,7);DB.setK('iid',id)}return id}
async function autosave(){
  autoT=null;if(!NATIVE)return;const data=payload();
  try{await writeDoc(autoName,data)}
  catch(e){
    /* po ponownej instalacji stary plik należy do poprzedniej instalacji i Android nie pozwala go nadpisać — zapis pod nową nazwą */
    try{const alt='biblioteka-trpg-'+(await installId())+'.json';if(autoName===alt)throw e;autoName=alt;DB.setK('altName',1);await writeDoc(autoName,data)}
    catch(e2){if(!autoErr){autoErr=true;toast('Autozapis nie działa: '+(e2.message||e2))}return}
  }
  autoErr=false;autoLast=Date.now();
  try{ /* kopia dnia, trzymamy 14 ostatnich */
    await writeDoc('kopie/biblioteka-'+today()+'.json',data);
    const r=await fsCall('readdir',{path:DIR+'/kopie',directory:'DOCUMENTS'});
    const names=(r.files||[]).map(f=>typeof f==='string'?f:f.name).filter(n=>/^biblioteka-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
    for(const n of names.slice(0,-14))await fsCall('deleteFile',{path:DIR+'/kopie/'+n,directory:'DOCUMENTS'}).catch(()=>{});
  }catch(e){}
}
function scheduleAutosave(){if(!NATIVE)return;clearTimeout(autoT);autoT=setTimeout(autosave,1500)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&autoT){clearTimeout(autoT);autosave()}});
$('#menuBtn').addEventListener('click',()=>{if(!NATIVE)return;

    `Automatyczny zapis: Dokumenty/${DIR}/${autoName}${autoLast?' · ostatnio o '+new Date(autoLast).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):''}. Kopie z ostatnich 14 dni są w podfolderze „kopie”.`});
if(NATIVE){
  $('#impFile').removeAttribute('accept');

}
async function nativeStart(){
  if(!NATIVE)return;
  const id=await DB.getK('iid');if(id&&await DB.getK('altName'))autoName='biblioteka-trpg-'+id+'.json';
  if(books.length||plays.length)return;
  /* pierwsze uruchomienie: może w Dokumentach jest kopia z poprzedniej instalacji */

    const d=JSON.parse(r.data);if((d.books||[]).length||(d.plays||[]).length)
      askRestore(d,(n,m)=>`Znaleziono zapisane dane w folderze Dokumenty: ${n} podręczników i ${m} sesji. Wczytać je?`);
  }catch(e){}
}

/* ---------- skaner kodów i wyszukiwanie po ISBN ---------- */
const PENDING='Do uzupełnienia (ISBN ';
function normIsbn(v){
  let x=String(v||'').toUpperCase().replace(/[^0-9X]/g,'');
  if(x.length===12&&/^\d+$/.test(x))x='0'+x; /* UPC-A */
  if(x.length===10){const c='978'+x.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+c[i])*(i%2?3:1);x=c+((10-s%10)%10)}
  return x;
}
function eanOk(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=(+x[i])*(i%2?3:1);return (10-s%10)%10===+x[12]}
const findByIsbn=n=>n?books.find(b=>normIsbn(b.isbn)===n):null;

let scan={stream:null,timer:0,cb:null,det:null,zx:null,busy:false};
function loadZx(){return new Promise((res,rej)=>{if(window.ZXing)return res();const sc=document.createElement('script');sc.src='zxing.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function getDecoder(){
  if(scan.det||scan.zx)return;
  if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e'].filter(x=>f.includes(x));if(want.includes('ean_13'))scan.det=new BarcodeDetector({formats:want})}catch(e){}}
  if(!scan.det){await loadZx();const Z=window.ZXing,h=new Map();
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);h.set(Z.DecodeHintType.TRY_HARDER,true);
    scan.zx=new Z.MultiFormatReader();scan.zx.setHints(h)}
}
const cv=document.createElement('canvas');
async function decodeFrom(src,w,h){
  if(scan.det){const r=await scan.det.detect(src);return r.length?r[0].rawValue:null}
  const Z=window.ZXing,k=Math.min(1,1000/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,cv.width,cv.height);
  try{return scan.zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}
}
function gotCode(code){
  const n=normIsbn(code);
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  const cb=scan.cb;close($('#scanSheet'));if(cb)cb(n);
}
async function startScan(cb){
  scan.cb=cb;open('#scanSheet');$('#torchBtn').hidden=true;
  const msg=$('#scanMsg');msg.textContent='Uruchamiam aparat…';
  try{await getDecoder()}catch(e){msg.textContent='Nie udało się wczytać czytnika kodów.';return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Ten telefon nie daje dostępu do aparatu na żywo. Użyj „Zdjęcie kodu”.';return}
  try{scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){msg.textContent='Brak dostępu do aparatu. Zezwól na aparat dla tej aplikacji albo użyj „Zdjęcie kodu”.';return}
  if(!$('#scanSheet').classList.contains('open')){stopScan();return}
  const v=$('#scanVideo');v.srcObject=scan.stream;try{await v.play()}catch(e){}
  try{const tr=scan.stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    if(cap.torch){let on=false;$('#torchBtn').hidden=false;$('#torchBtn').onclick=()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{})}}}catch(e){}
  msg.textContent='Skieruj aparat na kod kreskowy z tyłu książki';
  const tick=async()=>{
    if(!scan.stream)return;
    if(!scan.busy&&v.readyState>=2&&v.videoWidth){scan.busy=true;
      try{const c=await decodeFrom(v,v.videoWidth,v.videoHeight);if(c&&scan.stream){scan.busy=false;gotCode(c);return}}catch(e){}
      scan.busy=false}
    scan.timer=setTimeout(tick,180);
  };tick();
}
function stopScan(){clearTimeout(scan.timer);if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null}const v=$('#scanVideo');if(v)v.srcObject=null}
$('#snapBtn').onclick=()=>$('#snapFile').click();
$('#snapFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  $('#scanMsg').textContent='Odczytuję zdjęcie…';
  try{await getDecoder();const img=await createImageBitmap(f);const c=await decodeFrom(img,img.width,img.height);
    if(c)gotCode(c);else $('#scanMsg').textContent='Nie widzę kodu na zdjęciu. Zrób je z bliska, prosto i przy dobrym świetle.'}
  catch(x){$('#scanMsg').textContent='Nie udało się odczytać zdjęcia.'}};

/* wyszukiwanie w bazach: Biblioteka Narodowa, Google Books, Open Library */
const LANG={pl:'polski',pol:'polski',en:'angielski',eng:'angielski',de:'niemiecki',ger:'niemiecki',deu:'niemiecki'};
function getJSON(url,ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error(r.status);return r.json()})}
const yearOf=v=>(String(v||'').match(/\d{4}/)||[''])[0];
async function fromBN(n){const d=await getJSON(`https://data.bn.org.pl/api/institutions/bibs.json?isbnIssn=${n}&limit=1`);const b=d&&d.bibs&&d.bibs[0];if(!b)return null;
  return{src:'Biblioteka Narodowa',title:String(b.title||'').split(' / ')[0].replace(/\s*:\s*/g,': ').replace(/[\s.:;,/]+$/,''),publisher:String(b.publisher||'').replace(/[\s.:;,]+$/,''),year:yearOf(b.publicationYear),lang:LANG[String(b.language||'').toLowerCase().slice(0,3)]||(b.language==='polski'?'polski':''),authors:String(b.author||'')}}
async function fromGB(n){const d=await getJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${n}`);const v=d&&d.items&&d.items[0]&&d.items[0].volumeInfo;if(!v)return null;
  return{src:'Google Books',title:[v.title,v.subtitle].filter(Boolean).join(': '),publisher:v.publisher||'',year:yearOf(v.publishedDate),lang:LANG[v.language]||'',authors:(v.authors||[]).join(', '),cover:v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail||'').replace(/^http:/,'https:')}}
async function fromOL(n){const d=await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${n}&format=json&jscmd=data`);const v=d&&d['ISBN:'+n];if(!v)return null;
  return{src:'Open Library',title:[v.title,v.subtitle].filter(Boolean).join(': '),publisher:(v.publishers&&v.publishers[0]&&v.publishers[0].name)||'',year:yearOf(v.publish_date),lang:'',authors:(v.authors||[]).map(a=>a.name).join(', '),cover:v.cover&&(v.cover.medium||v.cover.small)}}
async function lookup(n){
  const r=(await Promise.allSettled([fromBN(n),fromGB(n),fromOL(n)])).map(x=>x.status==='fulfilled'?x.value:null).filter(Boolean);
  const failedAll=r.length===0;if(failedAll)return null;
  const pick=k=>(r.find(x=>x[k])||{})[k]||'';
  return{title:pick('title'),publisher:pick('publisher'),year:pick('year'),lang:pick('lang'),authors:pick('authors'),cover:pick('cover'),src:[...new Set(r.map(x=>x.src))].join(', ')};
}
async function coverData(url){if(!url)return'';try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);const r=await fetch(url,{signal:c.signal});clearTimeout(t);if(!r.ok)return'';
  const img=await createImageBitmap(await r.blob());if(img.width<20)return'';const k=Math.min(1,320/Math.max(img.width,img.height)),cn=document.createElement('canvas');
  cn.width=Math.round(img.width*k);cn.height=Math.round(img.height*k);cn.getContext('2d').drawImage(img,0,0,cn.width,cn.height);return cn.toDataURL('image/jpeg',.72)}catch(e){return''}}
const isPending=b=>String(b.title||'').startsWith(PENDING);

async function fillForm(n){
  const msg=$('#isbnMsg');
  if(!eanOk(n)){msg.textContent='To nie wygląda na poprawny numer ISBN.';return}
  const dup=findByIsbn(n);if(dup&&dup.id!==editId)msg.textContent=`Uwaga: masz już tę książkę — „${dup.title}”.`;
  if(navigator.onLine===false){msg.textContent=(dup?msg.textContent+' ':'')+'Brak internetu — zapisz z numerem ISBN, a dane pobierzesz później (menu ☰ → Uzupełnij dane).';if(!$('#title').value)$('#title').value=PENDING+n+')';return}
  msg.textContent='Szukam w bazach…';
  const r=await lookup(n);
  if(!r){msg.textContent='Nie udało się połączyć z bazami — dane pobierzesz później.';if(!$('#title').value)$('#title').value=PENDING+n+')';return}
  if(!r.title){msg.textContent='Nie znaleziono tej książki w bazach — uzupełnij ręcznie.';return}
  const t=$('#title');if(!t.value||t.value.startsWith(PENDING))t.value=r.title;
  if(!$('#publisher').value&&r.publisher)$('#publisher').value=r.publisher;
  if(!$('#year').value&&r.year)$('#year').value=r.year;
  if(r.lang)$('#lang').value=r.lang;
  if(!$('#notes').value&&r.authors)$('#notes').value='Autorzy: '+r.authors;
  if(!photo&&r.cover){const p=await coverData(r.cover);if(p)setPhoto(p)}
  msg.textContent=`Uzupełniono z: ${r.src}. Sprawdź i dopisz system.`;
  if(!$('#system').value)$('#system').focus();
}
function onScanned(n){
  const dup=findByIsbn(n);
  if(dup){edit(dup);$('#isbnMsg').textContent=dup.status==='want'?'Ta książka jest na Twojej liście życzeń.':'Masz już tę książkę w bibliotece.';toast(`Masz już: ${dup.title}`);return}
  edit();$('#isbn').value=n;fillForm(n);
}
$('#scanTop').onclick=()=>{if(view!=='shelf')setView('shelf');startScan(onScanned)};
$('#isbnScan').onclick=()=>startScan(n=>{$('#isbn').value=n;fillForm(n)});
$('#isbnLook').onclick=()=>{const n=normIsbn($('#isbn').value);if(!n){$('#isbnMsg').textContent='Najpierw wpisz lub zeskanuj ISBN.';return}$('#isbn').value=n;fillForm(n)};

/* uzupełnianie książek zapisanych bez internetu */
function updBulk(){const n=books.filter(isPending).length,b=$('#bulkLook');b.hidden=!n;b.textContent=`Uzupełnij dane po ISBN (${n})`}
$('#menuBtn').addEventListener('click',updBulk);
$('#bulkLook').onclick=async()=>{
  if(navigator.onLine===false){toast('Brak internetu — spróbuj później');return}
  const list=books.filter(isPending);let ok=0;$('#bulkLook').disabled=true;
  for(const b of list){$('#bulkLook').textContent=`Szukam… ${ok}/${list.length}`;
    const r=await lookup(normIsbn(b.isbn));if(r&&r.title){b.title=r.title;b.publisher=b.publisher||r.publisher;b.year=b.year||r.year;if(r.lang)b.lang=r.lang;if(!b.notes&&r.authors)b.notes='Autorzy: '+r.authors;if(!b.photo&&r.cover)b.photo=await coverData(r.cover);ok++}}
  $('#bulkLook').disabled=false;save();refresh();updBulk();toast(`Uzupełniono ${ok} z ${list.length}`);
};

/* ---------- start ---------- */
(async()=>{await DB.open();books=(await DB.get())||[];plays=(await DB.getK('plays'))||[];players=(await DB.getK('players'))||[];
  if(!(await DB.getK('playersInit'))){addPlayers([...plays.flatMap(p=>splitNames(p.players)),...books.filter(b=>b.status==='lent').map(b=>b.lentTo).filter(Boolean)]);DB.setK('playersInit',1)}
  refresh();nativeStart();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{if(!NATIVE&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
}
